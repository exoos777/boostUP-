<svg xmlns="http://www.w3.org/2000/svg" width="560" height="56" viewBox="0 0 560 56" fill="none">
  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono', Consolas, 'Courier New', monospace; }
      @keyframes glitch {
        0%, 92%, 100% { transform: translate(0, 0); }
        93% { transform: translate(-2px, 1px); }
        95% { transform: translate(2px, -1px); }
        97% { transform: translate(-1px, 0); }
      }
      @keyframes blinkDot {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.2; }
      }
      .glitch { animation: glitch 5s infinite; }
      .dot { animation: blinkDot 1.6s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Website -->
  <g>
    <rect x="2" y="6" width="172" height="44" rx="4" fill="#0B0D12"/>
    <rect x="2" y="6" width="172" height="44" rx="4" fill="none" stroke="#00E5FF" stroke-width="1.2" opacity="0.7"/>
    <path d="M2 20 V12 H10" stroke="#00E5FF" stroke-width="2"/>
    <circle cx="16" cy="28" r="3" fill="#00E5FF" class="dot"/>
    <text x="28" y="34" class="mono" font-size="13" fill="#E8EEF7" letter-spacing="1">WEBSITE</text>
  </g>

  <!-- Download -->
  <g class="glitch">
    <rect x="192" y="6" width="172" height="44" rx="4" fill="#0B0D12"/>
    <rect x="192" y="6" width="172" height="44" rx="4" fill="none" stroke="#FF3B5C" stroke-width="1.2" opacity="0.7"/>
    <path d="M192 20 V12 H200" stroke="#FF3B5C" stroke-width="2"/>
    <path d="M206 24 L212 30 L218 24 M212 16 V30" stroke="#FF3B5C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="228" y="34" class="mono" font-size="13" fill="#E8EEF7" letter-spacing="1">DOWNLOAD</text>
  </g>

  <!-- Developer -->
  <g>
    <rect x="382" y="6" width="176" height="44" rx="4" fill="#0B0D12"/>
    <rect x="382" y="6" width="176" height="44" rx="4" fill="none" stroke="#7C3AED" stroke-width="1.2" opacity="0.7"/>
    <path d="M382 20 V12 H390" stroke="#7C3AED" stroke-width="2"/>
    <path d="M404 16.6 C400.6 17.2 400.2 19.8 400.2 21.4 C400.2 23.4 401 25 403 25.6 C403.4 25.7 403.4 25.9 403.4 26 V29 C403.4 29.5 403.3 29.8 402.9 29.7 C399.6 28.7 397 25.9 397 21.6 C397 17.1 400.5 14 405 14 C409.5 14 413 17.1 413 21.6 C413 25.9 410.4 28.7 407.1 29.7 C406.7 29.8 406.6 29.5 406.6 29 V26 C406.6 25.9 406.6 25.7 407 25.6 C409 25 409.8 23.4 409.8 21.4 C409.8 19.8 409.4 17.2 406 16.6 Z" fill="#7C3AED"/>
    <text x="416" y="34" class="mono" font-size="13" fill="#E8EEF7" letter-spacing="1">DEVELOPER</text>
  </g>
</svg>
