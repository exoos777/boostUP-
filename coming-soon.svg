<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300" fill="none">
  <defs>
    <linearGradient id="barFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#FF3B5C"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=JetBrains+Mono:wght@400;600&display=swap');
      .display { font-family: 'Orbitron', 'Segoe UI', sans-serif; }
      .mono { font-family: 'JetBrains Mono', Consolas, monospace; }
      @keyframes fillbar {
        from { width: 0; }
        to { width: 460; }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes scanline {
        from { transform: translateX(-520px); }
        to { transform: translateX(520px); }
      }
      @keyframes softpulse {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
      }
      .bar { animation: fillbar 3.2s cubic-bezier(0.22,1,0.36,1) forwards; }
      .cursor { animation: blink 1s step-end infinite; }
      .scan { animation: scanline 4s linear infinite; }
      .pulse { animation: softpulse 2.2s ease-in-out infinite; }
      .corner { animation: softpulse 3.4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Panel -->
  <rect x="40" y="30" width="720" height="240" rx="10" fill="#0B0D12"/>
  <rect x="40" y="30" width="720" height="240" rx="10" fill="none" stroke="#1B2230" stroke-width="1.5"/>

  <!-- Corner brackets (HUD frame) -->
  <g stroke="#00E5FF" stroke-width="2" opacity="0.9">
    <path d="M34 64 V34 H64" class="corner"/>
    <path d="M736 34 H766 V64" class="corner" style="animation-delay:.4s"/>
    <path d="M34 236 V266 H64" class="corner" style="animation-delay:.8s"/>
    <path d="M736 266 V236 H766" class="corner" style="animation-delay:1.2s"/>
  </g>

  <!-- Title bar -->
  <text x="62" y="64" class="display" font-size="15" font-weight="700" fill="#E8EEF7" letter-spacing="3">BOOSTUP</text>
  <text x="150" y="64" class="mono" font-size="12" fill="#7A8499" letter-spacing="1">BUILD 2.0.0</text>
  <circle cx="722" cy="56" r="4" fill="#FF3B5C" class="pulse"/>

  <line x1="60" y1="78" x2="740" y2="78" stroke="#1B2230" stroke-width="1"/>

  <!-- Boot log -->
  <g class="mono" font-size="13">
    <text x="62" y="108" fill="#00E5FF">&gt;</text>
    <text x="76" y="108" fill="#C9D2E2">initializing core modules...</text>
    <text x="676" y="108" text-anchor="end" fill="#3DDC84">[ OK ]</text>

    <text x="62" y="130" fill="#00E5FF">&gt;</text>
    <text x="76" y="130" fill="#C9D2E2">loading optimizer engine...</text>
    <text x="676" y="130" text-anchor="end" fill="#3DDC84">[ OK ]</text>

    <text x="62" y="152" fill="#00E5FF">&gt;</text>
    <text x="76" y="152" fill="#C9D2E2">calibrating network routing...</text>
    <text x="676" y="152" text-anchor="end" fill="#3DDC84">[ OK ]</text>

    <text x="62" y="174" fill="#00E5FF">&gt;</text>
    <text x="76" y="174" fill="#C9D2E2">finalizing release build</text>
    <text x="676" y="174" text-anchor="end" fill="#FF3B5C" class="pulse">[...]</text>
  </g>

  <!-- Progress bar -->
  <rect x="62" y="200" width="460" height="6" rx="3" fill="#161B26"/>
  <rect x="62" y="200" width="0" height="6" rx="3" fill="url(#barFill)" class="bar"/>
  <text x="532" y="207" class="mono" font-size="12" fill="#00E5FF" font-weight="600">92%</text>
  <text x="62" y="228" class="mono" font-size="10" fill="#7A8499" letter-spacing="1.5">ALMOST THERE</text>

  <!-- Scanline -->
  <rect x="40" y="30" width="520" height="240" rx="10" fill="url(#scan)" class="scan" pointer-events="none"/>

  <!-- Headline -->
  <text x="400" y="196" text-anchor="middle" class="display" font-size="30" font-weight="900" fill="#E8EEF7" letter-spacing="8">COMING SOON</text>

  <!-- URL -->
  <text x="400" y="242" text-anchor="middle" class="mono" font-size="14" fill="#00E5FF" letter-spacing="1">myboostup.netlify.app</text>
  <rect x="322" y="226" width="6" height="18" fill="#00E5FF" class="cursor"/>
</svg>
