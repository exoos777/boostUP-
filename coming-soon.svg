<svg xmlns="http://www.w3.org/2000/svg" width="800" height="260" viewBox="0 0 800 260" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a12"/>
      <stop offset="100%" stop-color="#12101f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#ff4655"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c8d0e0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="260" rx="24" fill="url(#bg)"/>
  <rect width="800" height="260" rx="24" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.5"/>

  <!-- Accent glow blobs -->
  <ellipse cx="660" cy="40" rx="120" ry="80" fill="#7c3aed" opacity="0.12" filter="url(#softGlow)"/>
  <ellipse cx="140" cy="220" rx="130" ry="70" fill="#00f0ff" opacity="0.08" filter="url(#softGlow)"/>

  <!-- Grid dots -->
  <g fill="#ffffff" opacity="0.05">
    <circle cx="60" cy="60" r="1.5"/><circle cx="120" cy="60" r="1.5"/><circle cx="180" cy="60" r="1.5"/>
    <circle cx="60" cy="120" r="1.5"/><circle cx="120" cy="120" r="1.5"/><circle cx="180" cy="120" r="1.5"/>
    <circle cx="620" cy="60" r="1.5"/><circle cx="680" cy="60" r="1.5"/><circle cx="740" cy="60" r="1.5"/>
    <circle cx="620" cy="120" r="1.5"/><circle cx="680" cy="120" r="1.5"/><circle cx="740" cy="120" r="1.5"/>
  </g>

  <!-- Rocket / lightning icon -->
  <g transform="translate(400, 92)">
    <polygon points="0,-28 14,10 0,2 -14,10" fill="url(#accent)" filter="url(#glow)"/>
    <polygon points="0,-28 -5,4 -14,10 0,2" fill="#ffffff" opacity="0.35"/>
    <polygon points="0,10 -6,22 -3,16 0,20 3,16 6,22" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- Title -->
  <text x="400" y="60" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="800" fill="url(#textGrad)" letter-spacing="2">COMING SOON</text>

  <!-- Underline -->
  <rect x="280" y="72" width="240" height="3" rx="1.5" fill="url(#accent)" filter="url(#glow)"/>

  <!-- Subtitle -->
  <text x="400" y="148" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#9aa3b8" letter-spacing="4">THE DESKTOP APP IS ON ITS WAY</text>

  <!-- Divider dots -->
  <g fill="#00f0ff" opacity="0.7">
    <circle cx="385" cy="168" r="3"/><circle cx="400" cy="168" r="3"/><circle cx="415" cy="168" r="3"/>
  </g>

  <!-- Subscribe / website hint -->
  <text x="400" y="196" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#6b7388" letter-spacing="1">Be the first to know when it drops</text>
  <text x="400" y="222" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#00f0ff" filter="url(#glow)">myboostup.netlify.app</text>
</svg>
